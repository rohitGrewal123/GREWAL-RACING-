<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grewal Racing</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
}

body{
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

/* GAME */
#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(#79c9ff 0%,#dff5ff 38%,#777 38%,#333 100%);
}

/* SKY */
.sky{
  position:absolute;
  top:0;
  width:100%;
  height:40%;
  background:linear-gradient(#56b8ff,#d9f4ff);
}

/* ROAD */
.road{
  position:absolute;
  left:10%;
  width:80%;
  height:100%;
  background:#333;
  border-left:8px solid white;
  border-right:8px solid white;
  transform:perspective(400px) rotateX(0deg);
}

/* ROAD LINES */
.line{
  position:absolute;
  width:7px;
  height:90px;
  background:white;
  left:33.33%;
  animation:roadMove .55s linear infinite;
}

.line.right{
  left:66.66%;
}

@keyframes roadMove{
  from{top:-100px}
  to{top:100vh}
}

/* PLAYER */
.car{
  position:absolute;
  width:75px;
  height:135px;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(90deg,#9b0000,#ff2020,#9b0000);
  border-radius:18px 18px 10px 10px;
  border:3px solid #111;
  box-shadow:0 8px 15px #000;
  z-index:10;
}

.car:before{
  content:"";
  position:absolute;
  width:48px;
  height:45px;
  top:18px;
  left:10px;
  background:#172a3a;
  border:3px solid #111;
  border-radius:10px;
}

.car:after{
  content:"";
  position:absolute;
  width:48px;
  height:42px;
  bottom:18px;
  left:10px;
  background:#222;
  border-radius:8px;
}

/* WHEELS */
.wheel{
  position:absolute;
  width:12px;
  height:35px;
  background:#050505;
  border-radius:5px;
  top:30px;
}

.w1{left:-9px}
.w2{right:-9px}

.w3{
  left:-9px;
  bottom:25px;
  top:auto;
}

.w4{
  right:-9px;
  bottom:25px;
  top:auto;
}

/* ENEMY */
.enemy{
  position:absolute;
  width:70px;
  height:120px;
  background:linear-gradient(90deg,#004d99,#158cff,#003d7a);
  border-radius:16px;
  border:3px solid #111;
  z-index:5;
  box-shadow:0 7px 12px #000;
}

.enemy:before{
  content:"";
  position:absolute;
  width:45px;
  height:38px;
  top:15px;
  left:9px;
  background:#182b3b;
  border:3px solid #111;
  border-radius:9px;
}

/* HUD */
#hud{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  z-index:30;
  display:flex;
  justify-content:space-between;
  color:white;
  font-size:18px;
  font-weight:bold;
  text-shadow:2px 2px 3px #000;
}

/* CONTROLS */
.controls{
  position:absolute;
  bottom:20px;
  left:0;
  width:100%;
  z-index:50;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
}

.control{
  width:85px;
  height:70px;
  border-radius:20px;
  border:3px solid white;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:35px;
  font-weight:bold;
}

.control:active{
  transform:scale(.92);
  background:rgba(255,255,255,.3);
}

/* START SCREEN */
#startScreen,
#gameOver{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.78);
  color:white;
  text-align:center;
}

#startScreen h1,
#gameOver h1{
  font-size:42px;
  margin-bottom:15px;
}

#startScreen p{
  margin-bottom:25px;
  font-size:18px;
}

.startBtn{
  padding:15px 35px;
  border:0;
  border-radius:12px;
  background:#ff2020;
  color:white;
  font-size:20px;
  font-weight:bold;
}

/* HIDE */
.hidden{
  display:none !important;
}
</style>
</head>

<body>

<div id="game">

  <div class="sky"></div>

  <div class="road">

    <div class="line" style="top:0"></div>
    <div class="line right" style="top:-180px"></div>

  </div>

  <!-- PLAYER CAR -->
  <div id="player" class="car">
    <div class="wheel w1"></div>
    <div class="wheel w2"></div>
    <div class="wheel w3"></div>
    <div class="wheel w4"></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div>🏆 Score: <span id="score">0</span></div>
    <div>🪙 Coins: <span id="coins">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="control" id="leftBtn">⬅️</button>
    <button class="control" id="rightBtn">➡️</button>
  </div>

  <!-- START -->
  <div id="startScreen">
    <h1>🏎️ GREWAL RACING</h1>
    <p>Dodge traffic and collect coins!</p>
    <button class="startBtn" onclick="startGame()">START GAME</button>
  </div>

  <!-- GAME OVER -->
  <div id="gameOver" class="hidden">
    <h1>💥 GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <br>
    <button class="startBtn" onclick="restartGame()">PLAY AGAIN</button>
  </div>

</div>

<script>

const player = document.getElementById("player");
const game = document.getElementById("game");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const livesText = document.getElementById("lives");

let playerX;
let score = 0;
let coins = 0;
let lives = 3;

let speed = 5;
let gameRunning = false;

let enemies = [];

let movingLeft = false;
let movingRight = false;


/* START GAME */

function startGame(){

  document.getElementById("startScreen").classList.add("hidden");

  gameRunning = true;

  score = 0;
  coins = 0;
  lives = 3;

  scoreText.textContent = score;
  coinsText.textContent = coins;
  livesText.textContent = lives;

  playerX = window.innerWidth / 2;

  player.style.left = playerX + "px";

  createEnemy();

  gameLoop();
}


/* RESTART */

function restartGame(){

  location.reload();

}


/* CREATE ENEMY */

function createEnemy(){

  if(!gameRunning) return;

  const enemy = document.createElement("div");

  enemy.className = "enemy";

  const roadLeft = window.innerWidth * .1;
  const roadWidth = window.innerWidth * .8;

  const lanes = [
    roadLeft + roadWidth * .25,
    roadLeft + roadWidth * .5,
    roadLeft + roadWidth * .75
  ];

  const lane =
    lanes[Math.floor(Math.random() * lanes.length)];

  enemy.style.left = lane - 35 + "px";

  enemy.style.top = "-150px";

  game.appendChild(enemy);

  enemies.push(enemy);

  setTimeout(createEnemy, 1000);
}


/* COLLISION */

function collision(a,b){

  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  return !(
    r1.bottom < r2.top ||
    r1.top > r2.bottom ||
    r1.right < r2.left ||
    r1.left > r2.right
  );
}


/* GAME LOOP */

function gameLoop(){

  if(!gameRunning) return;


  /* PLAYER MOVEMENT */

  if(movingLeft){
    playerX -= 7;
  }

  if(movingRight){
    playerX += 7;
  }


  /* ROAD LIMIT */

  const minX = window.innerWidth * .1 + 45;
  const maxX = window.innerWidth * .9 - 45;

  if(playerX < minX){
    playerX = minX;
  }

  if(playerX > maxX){
    playerX = maxX;
  }

  player.style.left = playerX + "px";


  /* ENEMIES */

  enemies.forEach((enemy,index)=>{

    let top = parseFloat(enemy.style.top);

    top += speed;

    enemy.style.top = top + "px";


    /* COLLISION */

    if(collision(player,enemy)){

      enemy.remove();

      enemies.splice(index,1);

      lives--;

      livesText.textContent = lives;

      if(lives <= 0){

        endGame();

      }

    }


    /* REMOVE */

    if(top > window.innerHeight + 150){

      enemy.remove();

      enemies.splice(index,1);

      score++;

      scoreText.textContent = score;

    }

  });


  requestAnimationFrame(gameLoop);

}


/* END */

function endGame(){

  gameRunning = false;

  document.getElementById("finalScore").textContent = score;

  document.getElementById("gameOver").classList.remove("hidden");

}


/* LEFT */

function leftStart(e){

  e.preventDefault();

  movingLeft = true;

}

function leftStop(e){

  e.preventDefault();

  movingLeft = false;

}


/* RIGHT */

function rightStart(e){

  e.preventDefault();

  movingRight = true;

}

function rightStop(e){

  e.preventDefault();

  movingRight = false;

}


/* TOUCH */

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

leftBtn.addEventListener("touchstart",leftStart,{passive:false});
leftBtn.addEventListener("touchend",leftStop,{passive:false});

rightBtn.addEventListener("touchstart",rightStart,{passive:false});
rightBtn.addEventListener("touchend",rightStop,{passive:false});


/* MOUSE */

leftBtn.addEventListener("mousedown",leftStart);
leftBtn.addEventListener("mouseup",leftStop);
leftBtn.addEventListener("mouseleave",leftStop);

rightBtn.addEventListener("mousedown",rightStart);
rightBtn.addEventListener("mouseup",rightStop);
rightBtn.addEventListener("mouseleave",rightStop);


/* KEYBOARD */

document.addEventListener("keydown",function(e){

  if(e.key === "ArrowLeft"){
    movingLeft = true;
  }

  if(e.key === "ArrowRight"){
    movingRight = true;
  }

});

document.addEventListener("keyup",function(e){

  if(e.key === "ArrowLeft"){
    movingLeft = false;
  }

  if(e.key === "ArrowRight"){
    movingRight = false;
  }

});

</script>

</body>
    </html>
