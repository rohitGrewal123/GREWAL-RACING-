<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Grewal Racing</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#222;
}

/* START SCREEN */
#startScreen{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(#101010,#333);
    color:white;
    text-align:center;
}

#startScreen h1{
    font-size:40px;
    margin-bottom:12px;
}

#startScreen p{
    margin-bottom:25px;
    font-size:18px;
}

#startButton{
    padding:15px 35px;
    border:0;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
}

/* ROAD */
#road{
    position:absolute;
    top:0;
    left:10%;
    width:80%;
    height:100%;
    background:#444;
    border-left:5px solid white;
    border-right:5px solid white;
    overflow:hidden;
}

/* ROAD LINES */
.line{
    position:absolute;
    width:7px;
    height:100px;
    background:white;
    left:50%;
}

/* CARS */
.car{
    position:absolute;
    width:58px;
    height:100px;
    border-radius:12px;
}

#player{
    background:#e00000;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
}

.enemy{
    top:-120px;
    background:#ffd000;
}

#enemy2{
    background:#168cff;
}

/* WINDOWS */
.car::before{
    content:"";
    position:absolute;
    width:38px;
    height:25px;
    left:10px;
    top:12px;
    background:#111;
    border-radius:6px;
}

.car::after{
    content:"";
    position:absolute;
    width:38px;
    height:22px;
    left:10px;
    bottom:12px;
    background:#111;
    border-radius:6px;
}

/* HUD */
#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    z-index:50;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:18px;
    font-weight:bold;
}

/* COIN */
.coin{
    position:absolute;
    width:32px;
    height:32px;
    border-radius:50%;
    background:gold;
    border:4px solid white;
    box-shadow:0 0 12px gold;
}

/* CONTROLS */
.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:20px;
    z-index:200;
    display:flex;
    justify-content:space-between;
    padding:0 25px;
    pointer-events:none;
}

.control{
    pointer-events:auto;
    width:90px;
    height:70px;
    border:2px solid white;
    border-radius:18px;
    background:rgba(0,0,0,0.75);
    color:white;
    font-size:34px;
    font-weight:bold;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:none;
}

/* GAME OVER */
#gameOver{
    position:absolute;
    inset:0;
    z-index:150;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.82);
    color:white;
    text-align:center;
}

#gameOver h2{
    font-size:42px;
    margin-bottom:15px;
}

#restart{
    margin-top:20px;
    padding:14px 30px;
    border:0;
    border-radius:10px;
    font-size:20px;
}
</style>
</head>

<body>

<div id="game">

    <!-- START -->
    <div id="startScreen">
        <h1>🏁 GREWAL RACING</h1>
        <p>Race • Dodge • Collect</p>
        <button id="startButton">START GAME</button>
    </div>

    <!-- ROAD -->
    <div id="road">

        <div class="line" style="top:0"></div>
        <div class="line" style="top:180px"></div>
        <div class="line" style="top:360px"></div>
        <div class="line" style="top:540px"></div>
        <div class="line" style="top:720px"></div>

        <div id="player" class="car"></div>

        <div id="enemy1" class="car enemy"></div>

        <div id="enemy2" class="car enemy"></div>

        <div id="coin" class="coin"></div>

    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="score">🏆 0</div>
        <div id="coins">🪙 0</div>
        <div id="lives">❤️ 3</div>
    </div>

    <!-- MOBILE BUTTONS -->
    <div class="controls">

        <button class="control" id="left">
            ⬅️
        </button>

        <button class="control" id="right">
            ➡️
        </button>

    </div>

    <!-- GAME OVER -->
    <div id="gameOver">

        <h2>GAME OVER</h2>

        <p id="finalScore">🏆 Score: 0</p>

        <p id="finalCoins">🪙 Coins: 0</p>

        <button id="restart">
            🔄 PLAY AGAIN
        </button>

    </div>

</div>

<script>

const road = document.getElementById("road");
const player = document.getElementById("player");

const enemy1 = document.getElementById("enemy1");
const enemy2 = document.getElementById("enemy2");

const coin = document.getElementById("coin");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");

const gameOver = document.getElementById("gameOver");
const restart = document.getElementById("restart");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const livesText = document.getElementById("lives");

const finalScore = document.getElementById("finalScore");
const finalCoins = document.getElementById("finalCoins");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");


let playerX = 0;

let enemy1Y = -150;
let enemy2Y = -450;
let coinY = -300;

let score = 0;
let coins = 0;
let lives = 3;

let speed = 5;

let running = false;

let moveLeft = false;
let moveRight = false;


/* RANDOM POSITION */

function randomPosition(){

    return Math.floor(
        Math.random() *
        (road.clientWidth - 65)
    );

}


/* START */

function startGame(){

    startScreen.style.display = "none";
    gameOver.style.display = "none";

    running = true;

    score = 0;
    coins = 0;
    lives = 3;

    speed = 5;

    playerX =
        road.clientWidth / 2 - 29;

    enemy1Y = -150;
    enemy2Y = -450;
    coinY = -300;

    player.style.left =
        playerX + "px";

    enemy1.style.left =
        randomPosition() + "px";

    enemy2.style.left =
        randomPosition() + "px";

    coin.style.left =
        randomPosition() + "px";

    enemy1.style.top =
        enemy1Y + "px";

    enemy2.style.top =
        enemy2Y + "px";

    coin.style.top =
        coinY + "px";

    updateHUD();

    requestAnimationFrame(gameLoop);
}


/* HUD */

function updateHUD(){

    scoreText.innerText =
        "🏆 " + score;

    coinsText.innerText =
        "🪙 " + coins;

    livesText.innerText =
        "❤️ " + lives;
}


/* COLLISION */

function collision(a,b){

    const A = a.getBoundingClientRect();
    const B = b.getBoundingClientRect();

    return !(
        A.bottom < B.top ||
        A.top > B.bottom ||
        A.right < B.left ||
        A.left > B.right
    );
}


/* RESET ENEMY */

function resetEnemy(enemy){

    enemy.style.left =
        randomPosition() + "px";
}


/* GAME LOOP */

function gameLoop(){

    if(!running){
        return;
    }


    /* MOVE PLAYER */

    if(moveLeft){
        playerX -= 8;
    }

    if(moveRight){
        playerX += 8;
    }


    /* KEEP INSIDE ROAD */

    if(playerX < 0){
        playerX = 0;
    }

    if(
        playerX >
        road.clientWidth -
        player.clientWidth
    ){
        playerX =
        road.clientWidth -
        player.clientWidth;
    }

    player.style.left =
        playerX + "px";


    /* MOVE ENEMIES */

    enemy1Y += speed;
    enemy2Y += speed;
    coinY += speed;


    enemy1.style.top =
        enemy1Y + "px";

    enemy2.style.top =
        enemy2Y + "px";

    coin.style.top =
        coinY + "px";


    /* ENEMY 1 */

    if(enemy1Y > road.clientHeight){

        enemy1Y = -120;

        resetEnemy(enemy1);

        score++;
    }


    /* ENEMY 2 */

    if(enemy2Y > road.clientHeight){

        enemy2Y = -300;

        resetEnemy(enemy2);

        score++;
    }


    /* COIN */

    if(coinY > road.clientHeight){

        coinY = -200;

        coin.style.left =
            randomPosition() + "px";
    }


    /* COLLECT COIN */

    if(collision(player,coin)){

        coins++;

        coinY = -200;

        coin.style.left =
            randomPosition() + "px";
    }


    /* HIT ENEMY */

    if(collision(player,enemy1)){

        lives--;

        enemy1Y = -150;

        resetEnemy(enemy1);
    }


    if(collision(player,enemy2)){

        lives--;

        enemy2Y = -300;

        resetEnemy(enemy2);
    }


    /* SPEED */

    speed =
        5 + Math.floor(score / 10);


    updateHUD();


    /* GAME OVER */

    if(lives <= 0){

        endGame();

        return;
    }


    requestAnimationFrame(gameLoop);
}


/* GAME OVER */

function endGame(){

    running = false;

    moveLeft = false;
    moveRight = false;

    finalScore.innerText =
        "🏆 Score: " + score;

    finalCoins.innerText =
        "🪙 Coins: " + coins;

    gameOver.style.display =
        "flex";
}


/* MOBILE TOUCH CONTROL */

/* LEFT */

leftButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        moveLeft = true;
    },
    {passive:false}
);

leftButton.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        moveLeft = false;
    },
    {passive:false}
);

leftButton.addEventListener(
    "touchcancel",
    function(){

        moveLeft = false;
    }
);


/* RIGHT */

rightButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        moveRight = true;
    },
    {passive:false}
);

rightButton.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        moveRight = false;
    },
    {passive:false}
);

rightButton.addEventListener(
    "touchcancel",
    function(){

        moveRight = false;
    }
);


/* MOUSE CONTROL */

leftButton.addEventListener(
    "mousedown",
    function(){
        moveLeft = true;
    }
);

leftButton.addEventListener(
    "mouseup",
    function(){
        moveLeft = false;
    }
);

rightButton.addEventListener(
    "mousedown",
    function(){
        moveRight = true;
    }
);

rightButton.addEventListener(
    "mouseup",
    function(){
        moveRight = false;
    }
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft"){
            moveLeft = true;
        }

        if(e.key === "ArrowRight"){
            moveRight = true;
        }
    }
);

document.addEventListener(
    "keyup",
    function(e){

        if(e.key === "ArrowLeft"){
            moveLeft = false;
        }

        if(e.key === "ArrowRight"){
            moveRight = false;
        }
    }
);


/* START / RESTART */

startButton.addEventListener(
    "click",
    startGame
);

restart.addEventListener(
    "click",
    startGame
);

</script>

</body>
</html>
